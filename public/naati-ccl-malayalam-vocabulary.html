<!DOCTYPE html>
<html lang="en">
<head>

<title>NAATI CCL Malayalam — Study Mode</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #F0EEE9; --surface: #FFFFFF; --surface2: #F7F6F2;
  --ink: #1A1A2C; --ink2: #5A5A72; --accent: #3B5BDB; --accent-dim: #EEF2FF;
  --got: #2F9E44; --got-dim: #EBFBEE; --retry: #D9480F; --retry-dim: #FFF4E6;
  --border: #E2E0D8; --radius: 14px;
}
body { background: var(--bg); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; min-height: 100vh; display: flex; flex-direction: column; }
header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 0 24px; display: flex; align-items: center; justify-content: space-between; height: 56px; position: sticky; top: 0; z-index: 10; }
.logo { display: flex; align-items: center; gap: 10px; }
.logo-mark { width: 32px; height: 32px; border-radius: 8px; background: var(--accent); color: #fff; font-weight: 700; font-size: 14px; display: flex; align-items: center; justify-content: center; }
.logo-text { font-size: 15px; font-weight: 600; }
.logo-sub { font-size: 12px; color: var(--ink2); }
.header-stats { display: flex; gap: 20px; font-size: 13px; color: var(--ink2); }
.stat-val { font-weight: 700; color: var(--ink); }
.progress-track { height: 3px; background: var(--border); position: sticky; top: 56px; z-index: 9; }
.progress-fill { height: 100%; background: var(--got); transition: width 0.4s ease; width: 0%; }
.domain-bar { background: var(--surface); border-bottom: 1px solid var(--border); padding: 0 24px; overflow-x: auto; display: flex; gap: 6px; align-items: center; height: 52px; scrollbar-width: none; position: sticky; top: 59px; z-index: 8; }
.domain-bar::-webkit-scrollbar { display: none; }
.chip { flex-shrink: 0; padding: 5px 12px; border-radius: 20px; font-size: 12.5px; font-weight: 500; cursor: pointer; border: 1.5px solid transparent; background: var(--surface2); color: var(--ink2); transition: all 0.15s; white-space: nowrap; user-select: none; }
.chip:hover { border-color: var(--accent); color: var(--accent); }
.chip.active { background: var(--accent-dim); color: var(--accent); border-color: var(--accent); }
main { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 32px 24px 64px; gap: 24px; max-width: 640px; width: 100%; margin: 0 auto; }
.score-row { display: flex; gap: 8px; width: 100%; }
.score-pill { flex: 1; padding: 8px 12px; border-radius: 8px; display: flex; flex-direction: column; align-items: center; gap: 2px; }
.score-pill-got { background: var(--got-dim); color: var(--got); }
.score-pill-retry { background: var(--retry-dim); color: var(--retry); }
.score-pill-rem { background: var(--surface2); color: var(--ink2); }
.score-num { font-size: 1.2rem; font-weight: 700; }
.score-label { font-weight: 500; font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; }
.card-wrap { width: 100%; perspective: 1200px; cursor: pointer; }
.card { width: 100%; min-height: 240px; position: relative; transform-style: preserve-3d; transition: transform 0.45s cubic-bezier(0.4,0,0.2,1); border-radius: var(--radius); }
.card.flipped { transform: rotateY(180deg); }
.card-face { position: absolute; inset: 0; border-radius: var(--radius); backface-visibility: hidden; -webkit-backface-visibility: hidden; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 40px 36px; text-align: center; border: 1.5px solid var(--border); box-shadow: 0 2px 12px rgba(0,0,0,0.06); background: var(--surface); }
.card-back { transform: rotateY(180deg); }
.card-domain { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--accent); background: var(--accent-dim); padding: 3px 10px; border-radius: 20px; margin-bottom: 28px; }
.card-word { font-size: 2rem; font-weight: 700; color: var(--ink); line-height: 1.2; text-wrap: balance; letter-spacing: -0.5px; }
.card-hint { margin-top: 20px; font-size: 12.5px; color: var(--ink2); }
.card-manglish { font-size: 1.6rem; font-weight: 600; color: var(--accent); font-style: italic; line-height: 1.3; text-wrap: balance; }
.card-english-small { margin-bottom: 16px; font-size: 13px; color: var(--ink2); font-weight: 500; }
.actions { display: flex; gap: 12px; width: 100%; }
.btn { flex: 1; padding: 14px 20px; border-radius: 12px; font-size: 15px; font-weight: 600; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: transform 0.1s, opacity 0.15s; }
.btn:active { transform: scale(0.97); }
.btn:disabled { opacity: 0.35; cursor: default; }
.btn-got { background: var(--got); color: #fff; box-shadow: 0 2px 8px rgba(47,158,68,0.3); }
.btn-retry { background: var(--retry-dim); color: var(--retry); border: 1.5px solid #ffcdb2; }
.nav-row { display: flex; gap: 12px; width: 100%; align-items: center; justify-content: center; }
.btn-nav { background: var(--surface); border: 1.5px solid var(--border); color: var(--ink); padding: 9px 18px; border-radius: 10px; font-size: 13.5px; font-weight: 500; cursor: pointer; transition: border-color 0.15s; }
.btn-nav:hover { border-color: var(--accent); color: var(--accent); }
.btn-shuffle { background: var(--surface); border: 1.5px solid var(--border); color: var(--ink2); padding: 9px 14px; border-radius: 10px; font-size: 13px; cursor: pointer; }
.btn-shuffle:hover { border-color: var(--accent); color: var(--accent); }
.empty { text-align: center; padding: 60px 0; color: var(--ink2); }
.empty h2 { font-size: 1.4rem; color: var(--ink); margin-bottom: 8px; }
.empty p { font-size: 14px; margin-bottom: 20px; line-height: 1.6; }
.btn-reset { background: var(--accent); color: #fff; padding: 10px 24px; border-radius: 10px; font-size: 14px; font-weight: 600; border: none; cursor: pointer; margin: 4px; }
.btn-reset.retry-btn { background: var(--retry); }
@media (prefers-reduced-motion: reduce) { .card { transition: none; } .progress-fill { transition: none; } }
@media (max-width: 480px) { .card-word { font-size: 1.6rem; } .card-manglish { font-size: 1.3rem; } .header-stats { display: none; } }
</style>
</head>

<header>
  <div class="logo">
    <div class="logo-mark">N</div>
    <div><div class="logo-text">NAATI CCL</div><div class="logo-sub">Malayalam · Study Mode</div></div>
  </div>
  <div class="header-stats"><div><span class="stat-val" id="hdr-got">0</span> known</div><div><span class="stat-val" id="hdr-rem">—</span> left</div></div>
</header>

<div class="progress-track"><div class="progress-fill" id="progress"></div></div>
<div class="domain-bar" id="domain-bar"></div>

<main id="main">
  <div class="score-row" id="score-row">
    <div class="score-pill score-pill-got"><span class="score-num" id="count-got">0</span><span class="score-label">Got it</span></div>
    <div class="score-pill score-pill-rem"><span class="score-num" id="count-rem">—</span><span class="score-label">Remaining</span></div>
    <div class="score-pill score-pill-retry"><span class="score-num" id="count-retry">0</span><span class="score-label">Try again</span></div>
  </div>
  <div class="card-wrap" id="card-wrap">
    <div class="card" id="card">
      <div class="card-face card-front" id="card-front">
        <div class="card-domain" id="cf-domain"></div>
        <div class="card-word" id="cf-word"></div>
        <div class="card-hint">Click to reveal Manglish</div>
      </div>
      <div class="card-face card-back" id="card-back">
        <div class="card-english-small" id="cb-word-small"></div>
        <div class="card-manglish" id="cb-manglish"></div>
      </div>
    </div>
  </div>
  <div class="actions" id="actions">
    <button class="btn btn-retry" id="btn-retry" disabled>↩ Try again</button>
    <button class="btn btn-got" id="btn-got" disabled>✓ Got it</button>
  </div>
  <div class="nav-row">
    <button class="btn-nav" id="btn-prev">&larr; Prev</button>
    <button class="btn-shuffle" id="btn-shuffle">&hArr; Shuffle</button>
    <button class="btn-nav" id="btn-next">Next &rarr;</button>
  </div>
</main>

<script>
var ALL = JSON.parse(document.getElementById('vocab-data').textContent);
var ICONS = {"Education":"\uD83C\uDF93","Housing":"\uD83C\uDFE0","Finance":"\uD83D\uDCB0","Insurance":"\uD83D\uDEE1\uFE0F","Legal":"\u2696\uFE0F","Business":"\uD83D\uDCBC","Health":"\u2764\uFE0F","Office":"\uD83D\uDDC2\uFE0F","Consumer Affairs":"\uD83D\uDED2","Immigration":"\u2708\uFE0F","Employment":"\uD83D\uDCBC","Social Services":"\uD83E\uDD1D"};

var activeDomain = "all";
var queue = [];
var idx = 0;
var gotSet = new Set();
var retrySet = new Set();
var flipped = false;

function buildQueue() {
  var cards = [];
  for (var di = 0; di < ALL.length; di++) {
    var domain = ALL[di];
    if (activeDomain !== "all" && domain.id !== activeDomain) continue;
    for (var ti = 0; ti < domain.terms.length; ti++) {
      var term = domain.terms[ti];
      cards.push({ domain: domain.domain, id: domain.id, english: term.english, manglish: term.manglish });
    }
  }
  return cards;
}

function init() {
  queue = buildQueue();
  gotSet = new Set();
  retrySet = new Set();
  idx = 0;
  renderDomainBar();
  renderCard();
  updateStats();
}

function renderDomainBar() {
  var bar = document.getElementById("domain-bar");
  var total = ALL.reduce(function(n, d) { return n + d.terms.length; }, 0);
  var html = "";
  html += "<button class=\"chip " + (activeDomain === "all" ? "active" : "") + "\" data-domain=\"all\">All (" + total + ")</button>";
  for (var i = 0; i < ALL.length; i++) {
    var d = ALL[i];
    var icon = ICONS[d.domain] || "\uD83D\uDCDA";
    html += "<button class=\"chip " + (activeDomain === d.id ? "active" : "") + "\" data-domain=\"" + d.id + "\">" + icon + " " + d.domain + " (" + d.terms.length + ")</button>";
  }
  bar.innerHTML = html;
  bar.addEventListener("click", function(e) {
    var btn = e.target.closest("[data-domain]");
    if (btn) { activeDomain = btn.getAttribute("data-domain"); init(); }
  }, { once: true });
}

function remaining() {
  var rem = [];
  for (var i = 0; i < queue.length; i++) { if (!gotSet.has(i)) rem.push(i); }
  return rem;
}

function renderCard() {
  var rem = remaining();
  if (rem.length === 0) { showComplete(); return; }
  while (gotSet.has(idx)) { idx = (idx + 1) % queue.length; }
  var card = queue[idx];
  document.getElementById("cf-domain").textContent = (ICONS[card.domain] || "") + " " + card.domain;
  document.getElementById("cf-word").textContent = card.english;
  document.getElementById("cb-word-small").textContent = card.english;
  document.getElementById("cb-manglish").textContent = card.manglish;
  flipped = false;
  document.getElementById("card").classList.remove("flipped");
  document.getElementById("btn-got").disabled = true;
  document.getElementById("btn-retry").disabled = true;
  document.getElementById("card-wrap").style.cursor = "pointer";
}

function flipCard() {
  if (flipped) return;
  flipped = true;
  document.getElementById("card").classList.add("flipped");
  document.getElementById("btn-got").disabled = false;
  document.getElementById("btn-retry").disabled = false;
  document.getElementById("card-wrap").style.cursor = "default";
}

function markGot() {
  if (!flipped) return;
  gotSet.add(idx);
  retrySet.delete(idx);
  nextCard();
}

function markRetry() {
  if (!flipped) return;
  retrySet.add(idx);
  nextCard();
}

function nextCard() {
  updateStats();
  var rem = remaining();
  if (rem.length === 0) { showComplete(); return; }
  var next = (idx + 1) % queue.length;
  var safety = 0;
  while (gotSet.has(next) && safety < queue.length) { next = (next + 1) % queue.length; safety++; }
  idx = next;
  renderCard();
}

function prevCard() {
  var prev = (idx - 1 + queue.length) % queue.length;
  var safety = 0;
  while (gotSet.has(prev) && safety < queue.length) { prev = (prev - 1 + queue.length) % queue.length; safety++; }
  idx = prev;
  flipped = false;
  document.getElementById("card").classList.remove("flipped");
  document.getElementById("btn-got").disabled = true;
  document.getElementById("btn-retry").disabled = true;
  renderCard();
}

function shuffle() {
  var rem = [];
  for (var i = 0; i < queue.length; i++) { if (!gotSet.has(i)) rem.push(i); }
  for (var i = rem.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = queue[rem[i]]; queue[rem[i]] = queue[rem[j]]; queue[rem[j]] = tmp;
  }
  idx = rem[0] || 0;
  renderCard();
}

function updateStats() {
  var g = gotSet.size;
  var rem = queue.length - g;
  var r = retrySet.size;
  document.getElementById("count-got").textContent = g;
  document.getElementById("count-rem").textContent = rem;
  document.getElementById("count-retry").textContent = r;
  document.getElementById("hdr-got").textContent = g;
  document.getElementById("hdr-rem").textContent = rem;
  var pct = queue.length ? (g / queue.length * 100) : 0;
  document.getElementById("progress").style.width = pct + "%";
}

function showComplete() {
  var g = gotSet.size;
  var r = retrySet.size;
  var retryIdxArr = Array.from(retrySet);
  document.getElementById("main").innerHTML =
    "<div class=\"empty\">" +
    "<div style=\"font-size:3rem;margin-bottom:16px\">\uD83C\uDF89</div>" +
    "<h2>All done!</h2>" +
    "<p>You reviewed all " + queue.length + " words.<br>" +
    "<span style=\"color:var(--got);font-weight:600\">" + g + " known</span> &middot; " +
    "<span style=\"color:var(--retry);font-weight:600\">" + r + " to retry</span></p>" +
    "<div style=\"display:flex;gap:10px;justify-content:center;margin-top:20px;flex-wrap:wrap\">" +
    (r > 0 ? "<button class=\"btn-reset retry-btn\" id=\"btn-do-retry\">Retry missed (" + r + ")</button>" : "") +
    "<button class=\"btn-reset\" id=\"btn-restart\">Start over</button>" +
    "</div></div>";
  var restartBtn = document.getElementById("btn-restart");
  if (restartBtn) restartBtn.addEventListener("click", init);
  var retryBtn = document.getElementById("btn-do-retry");
  if (retryBtn) retryBtn.addEventListener("click", function() {
    var newQueue = retryIdxArr.map(function(i) { return queue[i]; });
    queue = newQueue; gotSet = new Set(); retrySet = new Set(); idx = 0;
    rebuildMain();
    renderCard(); updateStats();
  });
}

function rebuildMain() {
  document.getElementById("main").innerHTML =
    "<div class=\"score-row\" id=\"score-row\">" +
    "<div class=\"score-pill score-pill-got\"><span class=\"score-num\" id=\"count-got\">0</span><span class=\"score-label\">Got it</span></div>" +
    "<div class=\"score-pill score-pill-rem\"><span class=\"score-num\" id=\"count-rem\">0</span><span class=\"score-label\">Remaining</span></div>" +
    "<div class=\"score-pill score-pill-retry\"><span class=\"score-num\" id=\"count-retry\">0</span><span class=\"score-label\">Try again</span></div>" +
    "</div>" +
    "<div class=\"card-wrap\" id=\"card-wrap\">" +
    "<div class=\"card\" id=\"card\">" +
    "<div class=\"card-face card-front\" id=\"card-front\"><div class=\"card-domain\" id=\"cf-domain\"></div><div class=\"card-word\" id=\"cf-word\"></div><div class=\"card-hint\">Click to reveal Manglish</div></div>" +
    "<div class=\"card-face card-back\" id=\"card-back\"><div class=\"card-english-small\" id=\"cb-word-small\"></div><div class=\"card-manglish\" id=\"cb-manglish\"></div></div>" +
    "</div></div>" +
    "<div class=\"actions\" id=\"actions\">" +
    "<button class=\"btn btn-retry\" id=\"btn-retry\" disabled>\u21A9 Try again</button>" +
    "<button class=\"btn btn-got\" id=\"btn-got\" disabled>\u2713 Got it</button>" +
    "</div>" +
    "<div class=\"nav-row\">" +
    "<button class=\"btn-nav\" id=\"btn-prev\">&larr; Prev</button>" +
    "<button class=\"btn-shuffle\" id=\"btn-shuffle\">&hArr; Shuffle</button>" +
    "<button class=\"btn-nav\" id=\"btn-next\">Next &rarr;</button>" +
    "</div>";
  wireButtons();
}

function wireButtons() {
  document.getElementById("card-wrap").addEventListener("click", flipCard);
  document.getElementById("btn-got").addEventListener("click", markGot);
  document.getElementById("btn-retry").addEventListener("click", markRetry);
  document.getElementById("btn-prev").addEventListener("click", prevCard);
  document.getElementById("btn-next").addEventListener("click", nextCard);
  document.getElementById("btn-shuffle").addEventListener("click", shuffle);
}

document.addEventListener("keydown", function(e) {
  if (e.key === " " || e.key === "Enter") { e.preventDefault(); if (!flipped) flipCard(); }
  if (e.key === "ArrowRight") nextCard();
  if (e.key === "ArrowLeft") prevCard();
  if (e.key === "1" && flipped) markRetry();
  if (e.key === "2" && flipped) markGot();
});

wireButtons();
init();
</script>
</body>
</html>
